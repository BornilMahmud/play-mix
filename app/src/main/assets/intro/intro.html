<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Play Mix 3D Audio Intro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: sans-serif;
    }
    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #brand-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 18vh;
      pointer-events: none;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.65s ease-out, transform 0.65s ease-out;
    }
    #brand-overlay.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .brand-title {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: #FFFFFF;
      text-shadow: 0 0 24px rgba(124, 77, 255, 0.85), 0 0 42px rgba(0, 229, 255, 0.55);
    }
    .brand-subtitle {
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: #00E5FF;
      text-transform: uppercase;
    }
  </style>
  <script src="./three.min.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <div id="brand-overlay">
    <div class="brand-title">PLAY MIX</div>
    <div class="brand-subtitle">Audiophile 3D Sound Engine</div>
  </div>

  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var isShortMode = params.get('short') === '1';
      var totalDurationMs = isShortMode ? 1150 : 2800;

      var canvas = document.getElementById('webgl-canvas');
      var brandOverlay = document.getElementById('brand-overlay');
      var animFrameId = null;
      var isDisposed = false;
      var startTime = performance.now();

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(58, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 100);
      camera.position.z = 5.4;

      var renderer = new THREE.WebGLRenderer({ canvas: canvas });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      // 1. 3D Glowing Audio Sphere (Outer Electric Violet + Inner Soft Cyan Harmonic Core)
      var outerSphereGeo = new THREE.IcosahedronGeometry(1.25, 2);
      var outerSphereMat = new THREE.MeshBasicMaterial({
        color: 0x7c4dff,
        wireframe: true,
        opacity: 0.82
      });
      var outerSphere = new THREE.Mesh(outerSphereGeo, outerSphereMat);
      scene.add(outerSphere);

      var innerSphereGeo = new THREE.IcosahedronGeometry(0.78, 1);
      var innerSphereMat = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        wireframe: true,
        opacity: 0.92
      });
      var innerSphere = new THREE.Mesh(innerSphereGeo, innerSphereMat);
      scene.add(innerSphere);

      // 2. Animated 3D Sound Wave Rings
      var waveRings = [];
      for (var r = 0; r < 3; r++) {
        var ringGeo = new THREE.RingGeometry(1.35 + r * 0.35, 1.4 + r * 0.35, 56);
        var ringMat = new THREE.MeshBasicMaterial({
          color: r % 2 === 0 ? 0x00e5ff : 0x7c4dff,
          wireframe: true,
          opacity: 0.55 - r * 0.12
        });
        var ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = 1.05;
        scene.add(ringMesh);
        waveRings.push({ mesh: ringMesh, geo: ringGeo, mat: ringMat, phase: r * 0.33 });
      }

      // 3. 3D Particle Field
      var particleCount = 130;
      var particleCoords = new Float32Array(particleCount * 3);
      for (var i = 0; i < particleCount; i++) {
        var radius = 1.9 + Math.random() * 2.4;
        var theta = Math.random() * Math.PI * 2;
        var phi = Math.acos(2 * Math.random() - 1);
        particleCoords[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        particleCoords[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        particleCoords[i * 3 + 2] = radius * Math.cos(phi);
      }
      var particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute('position', new THREE.BufferAttribute(particleCoords, 3));
      var particleMat = new THREE.PointsMaterial({
        color: 0x00e5ff,
        size: 2.6,
        opacity: 0.78
      });
      var particleField = new THREE.Points(particleGeo, particleMat);
      scene.add(particleField);

      setTimeout(function () {
        if (!isDisposed && brandOverlay) {
          brandOverlay.classList.add('visible');
        }
      }, isShortMode ? 120 : 380);

      function disposeScene() {
        if (isDisposed) return;
        isDisposed = true;
        if (animFrameId !== null) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
        outerSphereGeo.dispose();
        outerSphereMat.dispose();
        innerSphereGeo.dispose();
        innerSphereMat.dispose();
        for (var i = 0; i < waveRings.length; i++) {
          waveRings[i].geo.dispose();
          waveRings[i].mat.dispose();
        }
        particleGeo.dispose();
        particleMat.dispose();
        renderer.dispose();
      }

      window.disposePlayMixIntro = disposeScene;

      function completeIntro() {
        disposeScene();
        if (window.PlayMixIntroBridge && typeof window.PlayMixIntroBridge.onIntroCompleted === 'function') {
          window.PlayMixIntroBridge.onIntroCompleted();
        }
      }

      function animate(now) {
        if (isDisposed) return;
        var elapsed = now - startTime;
        var t = elapsed * 0.001;

        // Audio sphere harmonic pulse & rotation
        var beatScale = 1.0 + Math.sin(t * 5.2) * 0.08;
        outerSphere.scale.set(beatScale, beatScale, beatScale);
        outerSphere.rotation.y = t * 0.85;
        outerSphere.rotation.x = t * 0.42;

        var coreScale = 1.0 + Math.cos(t * 7.5) * 0.12;
        innerSphere.scale.set(coreScale, coreScale, coreScale);
        innerSphere.rotation.y = -t * 1.25;
        innerSphere.rotation.z = t * 0.65;

        // Expanding 3D sound wave rings
        for (var i = 0; i < waveRings.length; i++) {
          var wr = waveRings[i];
          var cycle = (t * 0.65 + wr.phase) % 1.0;
          var s = 0.85 + cycle * 1.15;
          wr.mesh.scale.set(s, s, s);
          wr.mesh.rotation.z = t * (0.35 + i * 0.15);
          wr.mat.opacity = (1.0 - cycle) * 0.65;
        }

        // Orbiting 3D particles
        particleField.rotation.y = t * 0.28;
        particleField.rotation.x = Math.sin(t * 0.4) * 0.22;

        renderer.render(scene, camera);

        if (elapsed >= totalDurationMs) {
          completeIntro();
          return;
        }
        animFrameId = requestAnimationFrame(animate);
      }

      window.addEventListener('resize', function () {
        if (isDisposed) return;
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animFrameId = requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
